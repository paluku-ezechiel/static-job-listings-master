<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./assets/styles/styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Job Listings</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <header></header>
      <div class="static-job-container">
        <div class="static-job-items">
          <div class="static-job-image">
            <img src="./images/photosnap.svg" alt="image photo snap" />
          </div>
          <div class="static-job-elements">
            <div class="static-job-buttons">
              <p class="photosnap">Photosnap</p>
              <p class="para-new">New!</p>
              <p class="par-feature">Featured</p>
            </div>
            <div class="static-job-text">
              <p class="job-text">Senior Frontend Developer</p>
            </div>
            <div class="static-job-paragraphe">
              <p>1d ago</p>
              <p>.</p>
              <p>Full Time</p>
              <p>.</p>
              <p>USA only</p>
            </div>
          </div>
        </div>
        <div class="static-full-buttons">
          <div class="bouttons-class">
            <button>Frontend</button>
            <button>Senior</button>
            <button>HTML</button>
            <button>CSS</button>
            <button>JavaScript</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>

    <script src="./assets/js/data.js"></script>
  </body>
</html>
